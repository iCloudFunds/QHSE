:root {
  --red: #E53935;
  --blue: #1565C0;
  --blue2: #1E88E5;
  --yellow: #FFC107;
  --yellow2: #FFEB3B;
  --green: #2E7D32;
  --ink: #111827;
  --paper: #FFF8E1;
  --surface: #FFFFFF;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #141A24;
    --surface: #1D2532;
    --ink: #F6F0DC;
  }
}

* {
  box-sizing: border-box;
}

html, body, #root {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

button {
  font: inherit;
}

.sim-header {
  background: var(--blue);
  color: #fff;
  padding: 18px 14px;
  text-align: center;
  border-bottom: 8px solid var(--yellow);
}

.sim-header h1 {
  margin: 0;
  font-size: clamp(19px, 5.4vw, 26px);
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.sim-header p {
  margin: 6px 0 0;
  font-size: 14px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.sim-nav {
  position: sticky;
  top: var(--safe-area-inset-top);
  z-index: 5;
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  background: var(--red);
  padding: 10px;
}

.sim-nav button {
  border: 3px solid #fff;
  background: var(--yellow);
  color: #000;
  font-weight: 800;
  padding: 10px 14px;
  border-radius: 999px;
  cursor: pointer;
}

.sim-nav button.active {
  background: #fff;
  color: var(--blue);
}

.sim-nav button:focus-visible, .btn:focus-visible, .opt:focus-visible, .grid button:focus-visible {
  outline: 3px solid #111827;
  outline-offset: 2px;
}

.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding: 16px;
}

.card {
  background: var(--surface);
  border: 4px solid var(--blue);
  border-radius: 18px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: 0 6px 0 var(--yellow);
}

.badge {
  display: inline-block;
  background: var(--yellow);
  border: 2px solid #000;
  padding: 4px 10px;
  border-radius: 999px;
  font-weight: 800;
  color: #000;
}

.badge.blue {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}

.badge.red {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}

h2 {
  color: var(--blue);
  margin: 4px 0 8px;
  overflow-wrap: anywhere;
}

h3 {
  color: var(--red);
  overflow-wrap: anywhere;
}

p, li {
  overflow-wrap: anywhere;
}

.btn {
  background: var(--blue);
  color: #fff;
  border: 0;
  padding: 12px 18px;
  border-radius: 12px;
  font-weight: 800;
  cursor: pointer;
}

.btn.red {
  background: var(--red);
}

.btn.yellow {
  background: var(--yellow);
  color: #000;
}

.btn.green {
  background: var(--green);
}

.btn:disabled {
  opacity: .45;
  cursor: default;
}

.opt {
  display: block;
  width: 100%;
  text-align: left;
  background: #E3F2FD;
  border: 3px solid var(--blue);
  padding: 14px;
  border-radius: 14px;
  margin: 8px 0;
  font-size: 17px;
  cursor: pointer;
  font-weight: 700;
  color: #111827;
}

.opt:hover {
  background: var(--yellow2);
}

.opt.correct {
  background: #C8E6C9;
  border-color: var(--green);
}

.opt.wrong {
  background: #FFCDD2;
  border-color: var(--red);
}

.opt:disabled {
  cursor: default;
}

.flex {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
}

.progress {
  height: 18px;
  background: #E0E0E0;
  border: 3px solid var(--blue);
  border-radius: 999px;
  overflow: hidden;
}

.progress div {
  height: 100%;
  background: var(--red);
  width: 0%;
  transition: width .25s ease;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
  gap: 8px;
}

.grid button {
  padding: 10px;
  border: 3px solid var(--blue);
  background: #fff;
  border-radius: 10px;
  font-weight: 800;
  cursor: pointer;
  color: #111827;
}

.grid button.done {
  background: var(--yellow);
}

.hidden {
  display: none;
}

.model {
  background: #FFF9C4;
  border: 3px dashed var(--red);
  padding: 14px;
  border-radius: 12px;
  margin-top: 12px;
  color: #111827;
}

.lesson-nav, .q-nav {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 14px;
  flex-wrap: wrap;
}

#roses {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 99;
}

.rose {
  position: absolute;
  top: -40px;
  font-size: 34px;
  animation: fall 2.6s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: .9;
  }
}

.note {
  background: #E3F2FD;
  border-left: 8px solid var(--blue);
  padding: 12px;
  border-radius: 8px;
  color: #111827;
}

.home-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

@media (max-width: 600px) {
  .wrap {
    padding: 12px;
  }

  .card {
    padding: 16px;
  }

  .lesson-nav, .q-nav {
    flex-direction: column;
  }

  .lesson-nav .btn, .q-nav .btn {
    width: 100%;
    text-align: center;
  }

  .home-actions .btn {
    width: 100%;
    text-align: center;

atory System","Air: Nose → Pharynx → Larynx → Trachea → Bronchi → Lungs → Alveoli. Gas exchange in lungs: Oxygen in, Carbon Dioxide out. Movement = Diffusion. Diagram labels: 1 Nasal cavity, 2 Trachea, 3 Larynx."],["6. Muscles, Cramps & Infection","Quick sharp contraction = Tetanus / Cramp. Inflammation causes: injury, infection — NOT antibody. Infection = germs entering body. Hygiene prevents it: wash hands, PPE, clean workplace."],["7. First Aid — CPR, Scalds, Lifting","CPR = Cardio Pulmonary Resuscitation. NOT for shock alone — for stopped breathing/heart. Scald = steam / hot liquid. Fracture: tie with Splint/Sling. Lifting: Size up load, grip firmly, bend knees, keep back straight, breathe."],["8. Safety at Work","Best in safety: Be active, respect rules, use PPE, use suitable equipment. Stress causes: non-payment, overwork, conflict. Reduce stress: good management, breaks. Thermal discomfort: radiant temperature, air velocity, humidity."],["9. Accidents & Lifeguard","Work-related accident = accident during / because of work. Scaffold: check, stable base, guard rails, harness, no overload. Lifeguard: PROTECT (secure area, remove danger) → ALERT (call help) → RESCUE (first aid). Dangerous Situation + Dangerous Event → Danger meets Operator → Damage."],["10. Environment — Pollution & Waste","Pollution = introduction of harmful substances into environment. Types: air, water, soil. Waste: oil paint (toxic, pollutes water/soil — store safely, recycle), plastic brushes (non-biodegradable — reuse/recycle). Prevention: sort, recycle, treat, don't dump in streams."],["11. Sustainable Development & Global Warming","Objectives: meet present needs without harming future generations; protect environment + economy + society. Greenhouse gases: CO2, Methane, Nitrous oxide. Consequences: rising temperature, floods, drought, sea-level rise. Solutions: save energy, reduce fertiliser, prevent disease transmission."],["12. Ecology","Food chain: Producer → Consumer → Decomposer. Zero papers = no wastage, save trees. Deforestation = loss of trees, less oxygen, more CO2. Flammable pictogram = flame = product can catch fire. Keep away from heat."]],V0=[["Quality can be defined as","Quality of requirements","Amount of products","The superiority of something relative to others","The quantity of products produced",2,"Quality = how superior / fit for use something is compared to others."],["The abbreviation JIT (zero) means","Just in turn","Just in time","Just in tune","Just in time (duplicate)",1,"JIT = Just In Time — produce only when needed, no waste."],["Mobilization of a whole company to get client satisfaction is","Total quality management","Total productive maintenance","Quality control","Brainstorming",0,"Whole company + client satisfaction = TQM."],["An ecological importance of zero papers is","No cutting down of trees","Saving money","No wastage","No delay",2,"Zero papers = no wastage of paper / trees / resources."],["Select one advantage of respecting ISO norms","Reduces customer's loyalty","Reduces customer's trust","Reduces losses","Reduces efficiency",2,"ISO reduces losses, defects and complaints."],["What is the full meaning of TPM?","Total productive maintenance","Total productive management","Total permanent maintenance","Total permanent management",0,"TPM = Total Productive Maintenance."],["A quality criteria here is","Functioning staff","Functioning efficiency","Reliability","Intermittently",1,"A product must function efficiently to be quality."],["Identify the main cause for non-quality","Non compliance to standard","Effective communication","Respect of procedures","Respect of norms",0,"Non-quality comes from not following the standard."],["The following are types of quality assurance, except","Pre-Production Inspection","During Production Inspection","Pre-Shipment Inspection","Absence of Pre-Shipment Inspection",3,"QA includes the three inspections; absence is not a type."],["A document that keeps a record of deviation from standard is called","Non-conformity report","Non-conformity report (audit)","Audit report","Quality criteria",0,"Deviation = Non-conformity report."],["A quick and sharp contraction of a muscle is called","Tetanus","Contraction","Twitch","Strain",0,"Sudden sharp sustained contraction = Tetanus."],["The following are possible causes of inflammation except","Injury","Infection","Infection (germs)","Antibody",3,"Injury and infection cause inflammation; antibody fights it."],["Involuntary activities in the body is controlled by the","Brain","Spinal cord","Cerebellum","Synapse",1,"Involuntary / reflex actions are controlled via spinal cord."],["___ is not a tissue of the skeletal system","Cell","Bone","Ligament","Cartilage",0,"Bone, ligament and cartilage are skeletal tissues; cell is a general unit."],["Impulses are to the nervous system as ___ are to the endocrine system","Hormones","Nerves","Enzymes","Target organs",0,"Nerves carry impulses; endocrine carries hormones."],["One of these is NOT a primary sexual organ","Testis","Testis (male)","Vagina","Penis",2,"In this syllabus classification, vagina is listed as accessory, testis/penis as primary."],["The body temperature of a man in an air-conditioned office and that of a bricklayer under the sun is","25°C and 25°C","25°C and 25°C","36°C and 37°C","37°C and 37°C",3,"Healthy body temperature stays ~37°C in both."],["The part of the brain that controls balance is","Cerebrum","Cerebellum","Cerebellum (balance)","Medulla oblongata",1,"Cerebellum = balance and coordination."],["Light sensitive cells in the eye are found in","Lens","Cornea","Retina","Conjunctiva",2,"Retina contains light-sensitive cells."],["Chemicals that breakdown complex food into simple soluble substances are called","Hormones","Enzymes","Amino acids","Fatty acids",1,"Enzymes break down food."],["CPR in first aid stands for","Cardio Pulmonary Resuscitation","Cardio Pulmonary Respiration","Cardio Pulmonary Reconstruction","Cardio Pulmonary Reproduction",0,"CPR = Cardio Pulmonary Resuscitation."],["The effect of stress on work environment is","Non-payment of wages","Over work","Work accidents","Good management",0,"Non-payment causes stress; overwork also, but exam key = non-payment."],["Choose one suitable exercise for physical activity","Start vigorously","Begin slowly and cool down","Continue no matter how you feel","Taking in too much alcohol before exercise",1,"Warm up slowly, cool down after — safe exercise."],["When lifting heavy load, the following rules are respected except","Size up the load","Position yourself","Grip the load firmly","Breathe out when you lift",3,"In this paper, breathe out is listed as the exception — hold / control breathing and lift with legs."],["___ is every employee's duty to ensure safety at the work place is to","Never come late to office","Be polite","Motivate employees","Pin up pictograms or safety rules",2,"Motivating / encouraging colleagues helps safety culture."],["___ is best in work place safety","Respecting safety rules","Use suitable Personal Protective Equipment","Be active","No short cuts",2,"Being active / alert is best in this syllabus."],["A cause of scalding is","Electricity","Steam","X-ray","Fire",1,"Scald = hot liquid / steam. Fire = burn."],["A first aid tool used to tie a fracture is called","Sling","Tourniquet","Splint","Tourniquet (2)",2,"Splint supports / ties a fracture."],["Choose the odd from the list of construction equipment below","Ladder","Scaffold","Gloves","Thimble",3,"Thimble is sewing, not construction."],["Which of the following will reduce stress at work place?","Non-payment of wages","Over work","Conflict","Good management",3,"Good management reduces stress."],["Cardio Pulmonary Resuscitation is NOT applicable to ___ condition","Shock","Choking","Drowning","Asphyxia",0,"CPR is for stopped heart/breathing, not for shock alone."],["Which work condition can lead to lumbago?","Mixing of mortar","Poor feeding","Walking a long distance","Exercise",1,"Poor feeding / poor posture / strain can lead to lumbago (low back pain)."],["One means of correcting eye fatigue is by","Reading articles with small font size","Taking short breaks","Blinking","Winking",1,"Short breaks rest the eyes."],["A physiopathology of thermal discomfort is","Thirst","Air velocity","Humidity","Radiant temperature",3,"Radiant temperature affects thermal discomfort."],["___ is the symbol for a flammable substance","Flame symbol (A)","Explosive symbol (B)","Oxidising symbol (C)","Corrosive symbol (D)",0,"Flame = flammable."],["Which ISO standard is for Environmental Management?","ISO 9001","ISO 14000","ISO 31000","ISO 45001",1,"14000 = Environment, 31000 = Risk, 45001 = Safety."],["Which of the following is a greenhouse gas?","Oxygen","Nitrogen","Carbon dioxide","Hydrogen",2,"CO2 is a greenhouse gas causing global warming."],["Deforestation mainly causes","More oxygen","Less carbon dioxide","Loss of habitat and more CO2","More rainfall",2,"Cutting trees = loss of habitat + more CO2."],["The first step of a lifeguard intervention is to","ALERT","RESCUE","PROTECT","TREAT",2,"PROTECT → ALERT → RESCUE."],["Which PPE protects the eyes when painting?","Gloves","Safety goggles","Helmet","Boots",1,"Goggles protect eyes from paint / dust."],["Waste oil paint disposed in a stream causes","Clean water","Water pollution","More fish","No effect",1,"Oil paint pollutes water and soil."],["A producer in a food chain is","A lion","A plant","A mushroom","A man",1,"Plants produce food by photosynthesis."],["Which action saves energy?","Leaving lights on","Switching off unused lights","Using more fuel","Wasting paper",1,"Switch off unused lights = save energy."],["A work-related accident is an accident that happens","At home","During / because of work","On holiday","While sleeping",1,"Work-related = during / because of work."],["The gaseous exchange in lungs is by","Osmosis","Diffusion","Digestion","Respiration only",1,"Oxygen / CO2 move by diffusion."],["Which organ carries air to the lungs?","Oesophagus","Trachea","Aorta","Ureter",1,"Trachea carries air to bronchi / lungs."],["Good hygiene at work includes","Washing hands and wearing PPE","Spitting on floor","Leaving waste anywhere","Ignoring PPE",0,"Hand washing + PPE = hygiene."],["Sustainable development means","Using all resources now","Meeting present needs without harming future generations","Polluting more","Cutting all trees",1,"Sustainability protects future generations."],["Which pictogram means the product can catch fire?","Skull","Flame","Corrosion","Exclamation",1,"Flame = flammable."],["The best way to prevent scaffold accidents is","Ignore safety rules","Use stable scaffold, guard rails and harness","Overload scaffold","Work in rain",1,"Stable scaffold + rails + harness prevents falls."]],Jc=[["Section A Q1 — Define Quality Assurance","Quality Assurance is the set of planned actions to prevent defects and guarantee the product/service meets the required standard. Example: DELMANTEGO checks paint, trains workers, follows procedures before delivery."],["Section A Q1 — Factors that assure quality + worker qualifications","Factors: good raw materials, trained staff, suitable equipment, respect for procedures, control/inspection. Worker qualifications: training, experience, skill, knowledge of safety & quality rules."],["Section A Q2 — Define TQM and TPM","TQM = Total Quality Management: whole company works for client satisfaction. TPM = Total Productive Maintenance: maintain machines to avoid breakdowns and defects."],["Section A Q2 — Tools of Quality","Graphs, Control Sheets, Pareto diagram (80/20 — few causes, many defects), Cause-Effect / Fishbone diagram (find root cause)."],["Section A Q3 — Audit, Certification + ISO Table","Audit = check if company respects standards. Certification = official proof it respects them. ISO 14000 = Environmental Management, ISO 31000 = Risk Management, ISO 45001 = Occupational Health & Safety."],["Section B Q1 — Label respiratory diagram 1,2,3","1 = Nasal cavity / Nose, 2 = Trachea, 3 = Larynx. Air passes: Nose → Pharynx → Larynx → Trachea → Bronchi → Lungs."],["Section B Q2 — Two gases exchanged + name of movement","Oxygen (in) and Carbon Dioxide (out). Movement = Diffusion — gases move from high to low concentration in alveoli."],["Section B Q3 — Functions / hygiene of respiratory system","Functions: take in oxygen, remove CO2, allow speech, filter air. Hygiene: avoid dust/smoke, wear mask, ventilate, no smoking, clean workplace."],["Section C Q1 — Lung / eye infections + postural problems","Infections from dust/chemicals: cough, eye irritation. Postural: back pain, lumbago, sciatica, bursitis. Spine deformations from bad posture / heavy load."],["Section C Q2 — Dust & aggressive chemicals in paint","Dust/chemicals irritate lungs, eyes, skin. Prevention: mask, goggles, gloves, ventilation, safe storage, wash hands."],["Section C Q4 — Scaffold preventive measures","Check scaffold, stable base, guard rails, harness, no overload, trained workers, no work in bad weather."],["Section C Q4 — Accident diagram","Dangerous Situation: unsafe scaffold. Dangerous Event: fall. Danger: height. Operator: Daniel. Damage: Fall with loss of consciousness."],["Section C Q5 — Work-related accident + PROTECT","Work-related accident = accident during / because of work. PROTECT: secure area, remove danger, protect victim from further harm, wear PPE."],["Section C Q5 — ALERT & RESCUE steps","ALERT: call emergency / supervisor, give location. RESCUE: first aid, CPR if needed, call ambulance, do not move victim badly injured unless danger."],["Section D Q1 — Environmental pollution + waste table","Pollution = harmful substances introduced into environment. Oil paint: pollutes water/soil — store safely, recycle, never dump in stream. Plastic brushes: non-biodegradable litter — reuse, recycle, reduce use."],["Section D Q2 — Sustainable development","Objectives: (1) Meet present needs without harming future. (2) Protect environment, economy and society together."],["Section D Q2 — Solutions: energy / fertiliser / disease","Energy wastage: switch off lights, use efficient lamps. Fertiliser: use correct dose, organic manure. Disease transmission: hygiene, clean water, waste disposal."],["Section D Q3 — Flammable pictogram + greenhouse gases","Flame pictogram = product can catch fire — keep away from heat/flame. Greenhouse gases: Carbon dioxide (CO2) and Methane. Consequences: global warming, floods, drought, sea-level rise."]],B0=[["1. Quality Assurance, Certification & ISO 9001","Quality Assurance (QA) covers the realization of products and services — planned actions that prevent defects before delivery. Certification is recognition by a third, independent body that a quality system is implemented. The main quality standard is ISO 9001. The standardized definition of quality is the suitability of a product or service for its intended use."],["2. Control Process & Audit","The control process starts with setting standards, then measuring performance, comparing results with the standards, and correcting deviations. Auditors report to the company / management being audited, so findings can be corrected. Audit checks conformity; a deviation is recorded and followed up."],["3. Spine, Cervical / Dorsal Vertebrae & CNS","Cervical vertebrae are located on the neck. The spine supports the head and the trunk and protects the spinal cord. The spine includes 12 dorsal (thoracic) vertebrae. The Central Nervous System (CNS) is made up of the brain and the spinal cord."],["4. Immunity, Vaccine, Adrenal, Respiration & Excretion","Vaccine therapy strengthens the immune system over a long time by training it to recognise germs. The adrenal glands are located on the kidneys. Respiration is the breakdown of glucose to release energy. Excretion is the removal of toxic metabolic waste from the body."],["5. Blood Diseases & Health Risks","Tuberculosis is NOT a blood disease in this classification — it mainly affects the lungs. Know the difference between blood diseases, respiratory diseases and infections. The most important risk in business is the health and safety risk, because it threatens life, work and the enterprise itself."],["6. PPE / IPE & Workshop Safety","IPE means Individual Protective Equipment. A chemist is protected by wearing safety shoes, a blouse (overall), gloves and goggles — the right PPE for each part of the body. After work in a workshop, the place must be freed of any waste, cleaned, and tools stored in a box."],["7. ILO, Visual Fatigue & Desk Work","The role of the ILO is to improve and promote best working conditions. Visual fatigue is manifested as tearing (watery eyes). For prolonged desk-top / screen work: take breaks, rest your eyes and relax — do not stare without a break."],["8. Ladders, Scaffolds, Explosions & Fatal Accidents","On a ladder: you can work astride in case of a double ladder. On scaffolding: you can rest on the scaffolding (when it is stable and guarded). Explosions are manifested by flames and projections of all kinds. Fatal accidents are mostly due to poisoning and asphyxia."],["9. Sound & Frequency","Vibration travelling through air is sound. Frequency is the number of waves passing through a fixed point in a given time. Higher frequency = more waves per second. Sound needs a medium; in air it travels as vibrations."],["10. Environment in Cameroon, Greenhouse & Atmospheric Imbalance","The main pollutants disturbing atmospheric balance are greenhouse-effect gases. The main source of atmospheric imbalance is human activities. Greenhouse gas at planet level causes climatic dysfunction / global warming. In Cameroon the ministry in charge of environment is the Ministry of Environment, Nature Protection and Sustainable Development."],["11. Waste, Oils, Biodegradable Materials & Ecosystem","Biodegradable materials are organic materials — they can be broken down naturally. A treatment of used oils that is NOT hazardous is storage in tanks (collect, store safely, do not dump). An ecosystem is a set made up of living organisms and all that surrounds them."],["12. Landslides, Sahel Vert & Malaria–Cholera","Landslides are linked to heavy rain, steep slopes, deforestation and weak soil — NOT intense sunlight. Diseases caused by a dirty environment include malaria and cholera. The Sahel Vert / Green Sahel operation in Cameroon in the 1980s meant planting trees in the Sahelian zone to fight desertification."]],A0=[["Quality Assurance (QA) covers","Realization of products and services","Only the sale of products","Only the payment of workers","Only the cleaning of offices",0,"QA covers products and services."],["Certification is","A punishment for workers","Recognition by a third and independent body of implementation of a quality system","A price list for products","A holiday for the enterprise",1,"Certification is recognition by a third and independent body of implementation of a quality system."],["The main quality standard is","ISO 14000","ISO 45001","ISO 9001","ISO 31000",2,"The main quality standard is ISO 9001."],["The standardized definition of quality is","The colour of a product","The price of a product","The weight of a product","Suitability of a product or service",3,"Quality = suitability of a product or service for its intended use."],["A quality component in an enterprise is","Noise","Delay","Waste","Reliability",3,"Reliability is a quality component — the product/service does what is expected, every time."],["Examination of product quality by a standard organisation is called","Standardisation","Marketing","Advertising","Transport",0,"Examination of product quality by a standard organisation is standardisation."],["The document issued by a standard organisation is called","Invoice","Receipt","Delivery note","Certification",3,"A standard organisation issues certification."],["Which method cannot enable an enterprise to succeed?","Total Quality Management","Total Productive Maintenance","Just In Time","Total Quantity Management (fake method)",3,"Total Quantity Management is a fake method — it cannot enable an enterprise to succeed."],["Auditors should report to","The neighbours","The customers only","The company being audited / management being audited","The competitors",2,"Auditors should report to the company being audited / management being audited."],["The first step in the control process is to","Punish workers","Buy new machines","Close the enterprise","Set standards",3,"The first step in the control process is to set standards."],["Cervical vertebrae are located on","The Neck","The Back","The Leg","The Arm",0,"Cervical vertebrae are located on the neck."],["The role of the spine is","To digest food","To pump blood","To produce hormones","To support the head and the trunk",3,"The spine supports the head and the trunk."],["Intense mental activity will","Damage the brain","Make the brain healthy","Stop the brain","Shrink the brain",1,"Intense mental activity makes the brain healthy."],["The spine is made up of","5 cervical vertebrae","12 dorsal vertebrae","20 lumbar vertebrae","7 sacral vertebrae",1,"The spine is made up of 12 dorsal vertebrae."],["The Central Nervous System (CNS) is made of","Brain and spinal cord","Heart and lungs","Liver and kidney","Skin and muscles",0,"The CNS is made of the brain and spinal cord."],["Strengthening the immune system for a long time is by","Taking painkillers","Taking vitamins once","Vaccine therapy","Drinking water once",2,"Strengthening the immune system for a long time is by vaccine therapy."],["Adrenal glands are located","In the brain","On the kidneys","In the lungs","In the stomach",1,"Adrenal glands are located on the kidneys."],["Which is NOT a blood disease?","Anaemia","Tuberculosis","Leukaemia","Sickle cell disease",1,"Tuberculosis is NOT a blood disease — it mainly affects the lungs."],["Breakdown of glucose to release energy is called","Respiration","Digestion","Excretion","Circulation",0,"Breakdown of glucose to release energy is respiration."],["Removal of toxic metabolic waste from the body is","Digestion","Excretion","Respiration","Reproduction",1,"Removal of toxic metabolic waste is excretion."],["The most important risk in business is","Health and safety risk","Colour risk","Fashion risk","Music risk",0,"The most important risk in business is the health and safety risk."],["The person in charge of security in an enterprise is","The Employer","The Visitor","The Customer","The Neighbour",0,"The person in charge of security is the employer."],["Which guarantees the protection of a chemist?","Wearing sandals only","Wearing a cap only","Wearing earphones only","Wearing safety shoes, blouse, gloves and goggles",3,"A chemist is protected by wearing safety shoes, blouse, gloves and goggles."],["IPE means","International Protective Education","Individual Protective Equipment","Internal Production Equipment","Industrial Paper Equipment",1,"IPE means Individual Protective Equipment."],["Class-C fires are","Fires from wood and paper","Fires from cooking oil","Class-C fires (electrical equipment)","Fires from metals",2,"Class-C fires are fires involving electrical equipment."],["After work in a workshop, the workshop should be","Left dirty","Left with waste everywhere","Freed of any waste, cleaned and stored in a box","Locked with tools on the floor",2,"After work in a workshop, it should be freed of any waste, cleaned and stored in a box."],["The role of the ILO is","To collect taxes","To build roads","To improve and promote best working conditions","To sell machines",2,"The role of the ILO is to improve and promote best working conditions."],["Visual fatigue is manifested as","Sneezing","Coughing","Tearing","Laughing",2,"Visual fatigue is manifested as tearing (watery eyes)."],["Visual fatigue is manifested as","Sneezing","Coughing","Tearing","Laughing",2,"Visual fatigue is manifested as tearing — Q29 is kept as Visual fatigue = Tearing to avoid confusion with the merged question."],["Which preventive measure is NOT related to risks?","Action on the machine","Action on the environment","Action on the worker","Action on the employer",3,"In this paper, action on the employer is listed as NOT related to risks."],["For prolonged desk-top work, you should","Take breaks, rest your eyes, relax","Work without any break","Stare without blinking","Work in the dark",0,"For prolonged desk-top work: take breaks, rest your eyes, relax."],["Hands exposed to burns should be protected by","Wearing a helmet","Wear safety glasses","Wearing ear muffs","Wearing safety shoes",1,"In this paper the protective-equipment answer is protective wear. Note: hands need gloves — wear gloves for hands, plus goggles/glasses for eyes."],["Fatal accidents are mostly due to","Noise","Poisoning and asphyxia","Cold water","Bright light",1,"Fatal accidents are mostly due to poisoning and asphyxia."],["Explosions are manifested by","Flames and projections of all kinds","Silence only","Cold air only","Darkness only",0,"Explosions are manifested by flames and projections of all kinds."],["When working on a ladder","You must jump from it","You must carry heavy loads on your head","You can work astride in case of double ladder","You must work without holding it",2,"When working on a ladder, you can work astride in case of double ladder."],["When working on scaffolding","You must overload it","You can rest on the scaffolding","You must remove the guard rails","You must work in a storm",1,"When working on scaffolding, you can rest on the scaffolding (when stable and guarded)."],["Auto-immune diseases are due to","A lack of food","An excessive immune response","A lack of water","A lack of sleep only",1,"Auto-immune diseases are due to an excessive immune response."],["Vibration travelling through air is","Sound","Light","Heat","Smell",0,"Vibration travelling through air is sound."],["The number of waves through a fixed point is called","Speed","Volume","Frequency","Height",2,"The number of waves through a fixed point is frequency."],["In the event of an accident, you should","Notify the employer","Run away and hide","Keep quiet forever","Blame a colleague",0,"In the event of an accident, notify the employer."],["The main pollutants disturbing atmospheric balance are","Oxygen and nitrogen","Greenhouse-effect gases","Rain and snow","Sand and stones",1,"The main pollutants disturbing atmospheric balance are greenhouse-effect gases."],["The main source of atmospheric imbalance is","Human activities","Bird songs","Fish swimming","Cloud shapes",0,"The main source of atmospheric imbalance is human activities."],["Greenhouse gas at planet level causes","More snow only","More fish only","More flowers only","A climatic disfunction / global warming",3,"Greenhouse gas at planet level causes climatic dysfunction / global warming."],["The ministry in charge of environment in Cameroon is","Ministry of Environment, Nature Protection and Sustainable Development","Ministry of Sports","Ministry of Transport","Ministry of Finance",0,"In Cameroon it is the Ministry of Environment, Nature Protection and Sustainable Development."],["Biodegradable materials are","Plastic bags","Metal cans","Organic materials","Glass bottles",2,"Biodegradable materials are organic materials."],["A treatment of used oils that is NOT hazardous is","Dumping in a river","Storage in tanks","Pouring on soil","Burning in the open",1,"A treatment of used oils that is NOT hazardous is storage in tanks."],["Diseases caused by a dirty environment include","Headache and toothache","Malaria and cholera","Broken leg and sprain","Short sight and long sight",1,"Diseases caused by a dirty environment include malaria and cholera."],["Which is NOT related to landslides?","Heavy rain","Steep slopes","Intense sunlight","Weak soil",2,"Intense sunlight is NOT related to landslides."],["An ecosystem is","A single animal","A set made up of living organisms and all that surrounds them","A single plant","A single rock",1,"An ecosystem is a set made up of living organisms and all that surrounds them."],["The Sahel Vert / Green Sahel operation in Cameroon in the 1980s was","Building dams","Planting trees in Sahelian zone","Building airports","Digging mines",1,"Sahel Vert / Green Sahel was planting trees in the Sahelian zone."]],$0=[["1. House, Home, Family, Textiles & Floor","House = the building / structure. Home = the feeling of comfort, love and belonging inside it. Family = people living together and sharing life. Textiles = fabrics / cloth used in the home. Floor = the surface we walk on — keep it clean, dry and safe."],["2. Energy, Gas / Fuel Cookers, Fluorescent Lamps & Fuels — Firewood / Kerosene","Energy is needed for cooking, lighting and heating. Gas cookers are fast and clean but need care with gas leaks. Fluorescent lamps use less energy and last longer than ordinary bulbs. Firewood is cheap and local but smoky; kerosene is easy to carry and store but needs safe handling."],["3. Cleaning Agents & Stains, Drainage","Local cleaning agents (e.g. ash, sand, local soap, lemon) can clean safely and cheaply. Built-up stains are old, set-in stains; compound stains are made of two or more substances. Drainage carries dirty water away — concealed gutters, sewage and septic tanks must be kept clean and covered."],["4. Carpets, Furniture & Fixtures, Storing Clothes","Carpets and rugs warm a room, reduce noise and protect floors. Furniture = movable items (bed, chair, table). Fixtures = fixed items (cupboards, sinks). Choose bedroom, parlour and dining furniture for comfort, use and space. Store clothing clean, dry, folded or hung, away from damp and insects."],["5. Water & Pest Control","Water is used for drinking, cooking, washing, cleaning and watering plants. Keep drinking water clean and covered. Pest control: keep the home clean, store food covered, block holes, remove stagnant water, and use safe pest control — do not leave poison where children can reach it."],["6. Home Decoration & Care Labels","Home decoration principles: balance, harmony, proportion, rhythm and emphasis — a room should look pleasant and be easy to use. Care labels guide washing: Dry flat = lay flat to dry; Do not bleach = no bleach; Hot iron = iron on hot; Do not dry clean = do not take to dry cleaners."],["7. Refrigerator Rules & Sick Persons' Food","Refrigerator rules: wrap food, do not put in hot food, do not over-load, open the door as little as possible, clean with bicarbonate not detergent. For sick persons: cook soft, light, clean food, serve small portions, give plenty of clean water, and serve with care and hygiene."],["8. Electrical Safety","Electrical installations must be safe: do not overload sockets, do not touch switches with wet hands, keep wires away from water and heat, repair damaged wires, and switch off appliances not in use. Teach children not to play with sockets and plugs."],["9. Consumer Education & Money Management","Consumer education helps a buyer choose wisely. Avoid impulsive buying, check labels and prices, use consumer agents / associations for help, buy in bulk only when it saves money and stores well, and avoid misbranding (false labels). Money management: plan, budget, save, spend on needs first, keep records."],["10. Curtains / Draperies & Labour Saving Devices","Curtains / draperies give privacy, control light and heat, and decorate a room. Labour saving devices (e.g. blender, washing machine, vacuum cleaner, pressure cooker) save time and energy — choose the right device, use it safely, clean and store it well."]],W0=[["Section A • Q1 — Gas Cookers, Fluorescent Lamps, Choice of House & Local Cleaning Agents",`GAS COOKERS vs OTHER COOKERS: Gas cookers light quickly, cook fast, give easy heat control and leave no ash or smoke in the kitchen. Other cookers (firewood / charcoal / electric) may be cheaper to buy or use where gas is scarce, but firewood/charcoal smoke, take longer to light, and need more cleaning; electric cookers depend on power supply. Safety for gas: check hose and regulator, no leaks, keep gas away from flame when not in use, ventilate the kitchen.

FLUORESCENT LAMPS: Use less electricity than ordinary bulbs, give bright light, last longer, and stay cooler. Use them in kitchens, study rooms and living rooms. Switch off when not in use.

FACTORS IN CHOICE OF A HOUSE: (1) Size and number of rooms for the family. (2) Cost / rent the family can afford. (3) Location — near school, market, work, water and health centre, and safe area. (4) Water, electricity, drainage and roads. (5) Ventilation, light and space. (6) Safety, good neighbours and a clean environment.

LOCAL CLEANING AGENTS: Local soap, wood ash, sand, lemon, vinegar and salt. Ash and sand scour pots; lemon removes stains and smell; local soap washes clothes, dishes and floors. They are cheap, available and safe when used well. Rinse well after cleaning.`],["Section A • Q2 — House / Home / Floor / Family / Textiles, Energy, White Cotton Care & Roles of Mother",`DEFINITIONS + EXAMPLES: House = the building where people live (e.g. a two-bedroom house). Home = the love, comfort and belonging in that building. Floor = the bottom surface of a room (e.g. cement, tiles, wood) — keep it clean, dry and free from obstacles. Family = people related by blood, marriage or adoption living together (e.g. parents and children). Textiles = fabrics/cloth (e.g. cotton, wool, curtains, bed sheets, towels).

MANAGE ENERGY IN THE HOME: Switch off lights and appliances not in use; use fluorescent lamps; cook with lids on pots; do not open the fridge door often; iron many clothes at once; use natural light and air when possible; repair leaking taps and faulty wires.

CARE OF WHITE COTTON: Wash separately from coloured clothes; use warm water and mild soap; soak stained parts; rinse well; dry in sunlight to keep it white; iron on hot (cotton needs hot iron); store clean and dry.

ROLES OF A MOTHER: Cares for children and family health; plans meals and keeps the home clean; teaches children good manners and hygiene; manages home money and shopping; supports the family emotionally; keeps the home peaceful and organised.`],["Section A • Q3 — Stains, Drainage, Carpets / Rugs, Furniture / Fixtures & Storing Clothing",`BUILT-UP vs COMPOUND STAINS: Built-up stains are old stains that have stayed long and set into the fabric (e.g. old blood or old oil stain) — harder to remove, need soaking and gentle treatment. Compound stains are made of two or more substances (e.g. tea + milk, or grease + dust) — treat each part: remove grease first, then the colour stain.

DRAINAGE / CONCEALED GUTTERS / SEWAGE / SEPTIC TANKS: Drainage carries dirty water away from the home. Concealed gutters are hidden channels that carry rainwater away without spoiling the look of the house. Sewage is waste water from toilets, kitchens and bathrooms. A septic tank is an underground tank that receives and breaks down sewage. Keep drains clean, covered and free from rubbish; do not pour oil or solid waste into drains.

CARPETS / RUGS — USES: Warm the room, make it look beautiful, reduce noise, protect the floor, and give comfort under feet. Shake, brush and air them; wash or clean when dirty; keep them dry to avoid smell and insects.

FURNITURE / FIXTURES — BEDROOM / PARLOUR / DINING: Furniture = movable (bed, chair, table, wardrobe). Fixtures = fixed (built-in cupboard, sink, shelf). Bedroom: bed, wardrobe, mirror, bedside table. Parlour: sofa/chairs, centre table, TV stand, curtains. Dining: dining table and chairs, sideboard, water jug.

STORING CLOTHING: Wash, dry and iron before storing; fold knitted clothes, hang suits/shirts; keep in clean, dry wardrobes or boxes; use mothballs / cedar away from children; air clothes often; keep white and coloured clothes separate.`],["Section A • Q4 — Uses of Water, Pest Control, Home Decoration & Care Labels",`USES OF WATER: Drinking, cooking, washing clothes and dishes, bathing, cleaning the house, flushing toilets, watering plants, and cooling. Save water: turn off taps, repair leaks, use a basin not a running tap, reuse clean water for plants where safe.

PEST CONTROL: Keep the home clean; store food covered in tight containers; remove rubbish daily; block holes and cracks; remove stagnant water (mosquitoes); keep bins covered; use safe insect sprays or traps and keep poisons away from children and food; air and sun bedding to kill bed bugs.

HOME DECORATION PRINCIPLES: (1) Balance — furniture and colour spread evenly. (2) Harmony — colours and items go together. (3) Proportion — size of furniture fits the room. (4) Rhythm — repeat colour/pattern to lead the eye. (5) Emphasis — one fine centre of interest (e.g. a picture or fine chair). (6) Suitability — decoration fits the use of the room and the family budget.

CARE LABELS: Dry flat = lay the garment flat on a clean surface to dry (do not hang — it may stretch). Do not bleach = do not use bleach — it will damage colour/fabric. Hot iron = iron with a hot iron (suitable for cotton/linen). Do not dry clean = do not send to dry cleaners — wash by hand/machine as directed instead.`],["Section B • Q5 — Refrigerator Rules, Sick Persons' Food, Electrical Safety & Consumer Education",`REFRIGERATOR RULES: (1) Wrap food / cover in clean containers so smells do not mix. (2) Do not put in hot food — let it cool first. (3) Do not over-load — cold air must circulate. (4) Open the door as little as possible — cold escapes. (5) Clean with bicarbonate (baking soda) not detergent — detergent leaves smell/taste. Also: keep the fridge in a cool, airy place; check temperature; throw away spoilt food.

COOKING / SERVING SICK PERSONS: Cook clean, soft, light and easily digested food (e.g. pap, rice water, soft rice, soup); avoid too much oil, pepper or spice; serve small portions often; give plenty of clean water / oral fluids; serve in clean, covered dishes; wash hands; keep the sick person comfortable and encourage eating.

ELECTRICAL INSTALLATIONS SAFETY: Use qualified persons to install; do not overload sockets; do not touch switches/plugs with wet hands; keep wires away from water, heat and sharp edges; replace damaged wires/plugs; switch off and unplug appliances not in use; keep children away from sockets; use correct fuses/breakers.

CONSUMER EDUCATION: Consumer education teaches buyers to choose wisely. Impulsive buying = buying suddenly without planning — avoid it by writing a shopping list and sticking to a budget. Consumer agents / associations help consumers know their rights, complain and get good quality. Bulk purchase = buying large quantity at once — good when it saves money and stores well, bad when it spoils or wastes money. Misbranding = false or misleading labels/packaging — check labels, dates, weight and quality before buying.`],["Section B • Q6 — Fuels, Firewood vs Kerosene, Money Management, Curtains & Labour Saving Devices",`TYPES OF FUELS: Firewood, charcoal, kerosene, gas, electricity, coal, petrol/diesel. Fuels give heat for cooking, light and power.

FIREWOOD vs KEROSENE — ADVANTAGES / DISADVANTAGES: Firewood advantages: cheap, locally available, no special stove needed. Disadvantages: smoky, causes eye/respiratory problems, takes time to light, needs storage space, cutting trees harms environment. Kerosene advantages: lights quickly, easy to carry and store, less smoke than firewood, heat easy to control. Disadvantages: costs money, fire risk if spilt, smell, needs a good stove and safe storage away from children.

MONEY MANAGEMENT PRINCIPLES: Plan and budget; list needs before wants; save a part of income; keep records of spending; avoid waste and impulsive buying; buy quality that lasts; compare prices; pay debts on time; keep emergency money.

CURTAINS / DRAPERIES — USES: Give privacy, control light and heat, keep out dust/insects, decorate and beautify the room, and make a room look warm and complete. Choose colour and fabric to match the room; wash/iron and hang neatly.

LABOUR SAVING DEVICES: Devices that save time and energy — e.g. blender, electric iron, washing machine, vacuum cleaner, pressure cooker, gas cooker, refrigerator. Choose the right size for the family, read instructions, use safely, clean after use, and store well; repair when faulty.`]],H0=[["1. Quality — Definition, Quality Hospital Services & Non-Quality","Quality = fitness for use / superiority of something relative to others — a service that meets the customer's need and the required standard. Quality hospital services: clean rooms, safe care, welcoming patients, respected hygiene rules, work done on time. Causes of non-quality: unqualified staff, poor organisation, unsuitable material, no respect for procedures, lack of control."],["2. ISO, Certification, Quality Audit, TPM / TQM & Five Zeros","ISO = International Standardisation Organization. Certification = recognition by an independent body that a quality system is respected. Quality Audit = check of conformity to standards, in 3 stages: preparation, carrying out the audit, report / follow-up. TPM = Total Productive Maintenance. TQM = Total Quality Management. Five zeros: zero defect, zero delay, zero breakdown, zero stock, zero paper."],["3. Chronogram — Cumulative Duration, Longest Task & How To Read It","A chronogram shows tasks against time. Each shaded square = a unit of time for that task. Cumulative duration = add the durations of the tasks one after another. Longest task = the task with the most shaded squares / longest bar. Read left to right: task name, start, duration, next task. For Diana: empty bins = 16 min given; wash floor / wet sweep is the longest task from the shaded squares."],["4. Vertebral Column — 7 Cervical, 12 Dorsal, 5 Lumbar, 5 Sacral, 4 Coccyx","Vertebral column = 33 vertebrae: 7 cervical (neck), 12 dorsal / thoracic (back), 5 lumbar (lower back), 5 sacral (sacrum), 4 coccyx. It supports the head and trunk and protects the spinal cord. The most stressed area in Diana's work is the lumbar region. Intervertebral disc = cartilage between two vertebrae that cushions and allows movement."],["5. Lumbago — Definition, Mechanism & Posture","Lumbago = pain in the lower back (lumbar region). Mechanism: repeated effort, bad posture and heavy loads strain muscles, ligaments and discs in the lumbar area. Posture rules: lean forward with a straight back rather than bending the back, squat / bend the knees to pick up, stand up steadily, avoid twisting the trunk while carrying a load."],["6. Human vs Company Determinants, Prescribed vs Actual Work, Effects","Human determinants: age, health, strength, fatigue, training, experience. Company determinants: organisation, timetable, material, workload, working alone. Prescribed work = what is ordered / written in the procedure. Actual work = what the worker really does, with real difficulties and adjustments. Effects on operator: fatigue, pain, illness, accidents. Effects on company: absenteeism, lower quality, delays, costs."],["7. Physical Activity Risks — Solutions With Justifications","Risks: lumbago, fatigue, cramp, falls, musculoskeletal pain. Solutions: use long-handled tools — so the worker does not bend the back; bend the knees, not the back — legs carry the load; avoid twisting — twisting strains the lumbar spine; take breaks — rest lets muscles recover; work in pairs — share heavy loads and help each other."],["8. Biological Risk — Definition, Hypotheses & Epidemiological Chain","Biological risk = risk of infection / disease from living agents (bacteria, viruses, fungi, parasites) present in waste, blood, body fluids and dirty surfaces. Hypotheses for physical + biological risks: Diana works alone, handles waste, uses water / chemicals, bends and lifts, and contacts germs. Epidemiological chain: Reservoir → Transmission → Route of entry → Host. Break one link to prevent infection."],["9. Biological Agents Groups 1–4 — Diana's Agents","Group 1: no disease in humans. Group 2: can cause disease, spread unlikely, prophylaxis (prevention / treatment) exists. Group 3: serious disease, spread possible, prophylaxis exists. Group 4: serious disease, spread high, no prophylaxis. Diana's agents — Group 2: Legionella, Leptospira, Staphylococcus aureus, Hepatitis A. Group 3: Tuberculosis bacilli, Brucellosis, HIV."],["10. Professional Disease — Definition, Who Qualifies & Prevention","Professional disease = a disease caused by work / exposure at work, recognised in a list of occupational diseases. It is qualified by the occupational doctor / competent authority — not by the worker alone. Individual preventive measures: PPE, hygiene, correct posture. Collective preventive measures: ventilation, organisation, safe material, training, cleaning of premises."],["11. Medical Waste — Definition, Environmental Effects & Destruction","Medical waste = waste from care: sharps, infected dressings, blood, medicines, contaminated material. 3 direct environmental effects: pollution of water, pollution of soil, pollution of air (and harm to living beings). 2 environmentally friendly destruction methods: incineration in a controlled / adapted incinerator and safe treatment / sterilisation before disposal — never dump in nature or in ordinary bins."],["12. Global Warming + Recyclable Waste — Treatment Matching","Global warming = rise in the Earth's average temperature from greenhouse gases. 2 causes: burning fossil fuels / deforestation and polluting human activities. 2 actions to limit it: plant trees and use renewable energy / save energy. Treatment codes: 1 = Recycling, 2 = Incineration, 3 = Composting, 4 = Storage Center. Brochures = 1 Recycling, plastic bottles = 1 Recycling, wax strip = 2 Incineration, polish / solvent bottles = 4 Storage Center, food waste = 3 Composting."]],Q0=[["Which is NOT related to quality?","Reliability","Suitability","Conformity","Quality quantities",3,"Reliability, suitability and conformity are related to quality; 'quality quantities' is not a quality characteristic."],["Principal standards for quality are","ISO 14000","ISO 9001-4","ISO 45001","ISO 31000",1,"The principal quality standards in this paper are ISO 9001-4."],["A skill used to analyse numerical data is","Pareto diagram","Brainstorming","Fishbone diagram","Control sheet",0,"Pareto diagram analyses numerical data — few causes, many defects."],["A skill used to analyse non-numerical data is","Histogram","Brainstorming","Pareto diagram","Control chart",1,"In this paper, brainstorming is the key for non-numerical ideas / data."],["A cause of non-quality is","Unqualified staff","Trained staff","Good materials","Respect for procedures",0,"Unqualified staff cause errors and non-quality."],["A principle of the quality approach is","Ignoring standards","Respecting the standards","Working alone","Skipping controls",1,"The quality approach means respecting the standards."],["ISO means","International Standardisation Organization","International Safety Office","Institute for Standard Quality","International Service Organization",0,"ISO = International Standardisation Organization."],["Total Quality means","Only managers work for quality","Only quality control","Only inspection","Mobilization of whole company to get better client satisfaction",3,"Total Quality = whole company mobilised for client satisfaction."],["Key characteristics of an effective control are","Flexibility, accuracy, relevance and objectivity","Slow, vague, late and partial","Expensive, secret and rigid only","Rare, noisy and long only",0,"Effective control is flexible, accurate, relevant and objective."],["Process control in this paper is carried out","Before production","Only after sale","Never","Only at delivery",0,"In this paper, process control is placed before production."],["Which is listed as NOT a property of muscle in this paper's exam key?","Contractility","Elasticity","Extensibility","Excitability",3,"Muscle properties are contractility, elasticity and extensibility; in this paper's exam key, excitability is listed as the NOT answer."],["A deformity of the vertebral column is","Kyphosis","Diabetes","Fracture","Hypertension",0,"Kyphosis is a deformity / abnormal curvature of the vertebral column."],["A nutritional disease caused by high blood sugar is","Anaemia","Asthma","Diabetes","Tuberculosis",2,"Diabetes is linked to high blood sugar."],["A skeletal accident is","Burn","Cut","Fracture","Poisoning",2,"Fracture = break of a bone, a skeletal accident."],["An illness that can be caused by stress is","Fracture","Arterial hyper tension","Diabetes","Tuberculosis",1,"Stress can cause arterial hypertension (high blood pressure)."],["Poor organization in a workshop can cause","Headache","Good health","More rest","Safety",0,"Poor organisation causes stress, fatigue and headache."],["The organ principally involved in physical activity is","The eye","The ear","The leg","The nose",2,"In this paper, the leg is the organ principally involved in physical activity."],["The intervertebral disc is","A bone","A cartilage between vertebrae","A muscle","A nerve",1,"The intervertebral disc is cartilage between two vertebrae."],["Which is a part of a cell?","Nucleus","Brick","Stone","Wood",0,"Nucleus is a part of a cell, with cytoplasm and membrane."],["Which is a tissue of the human body?","Epithelial tissue","Plastic","Metal","Glass",0,"Tissues include epithelial, connective, muscular and nervous tissue."],["Who is responsible for the declaration of an accident?","Visitor","Customer","The employer","Neighbour",2,"The employer is responsible for declaring a work accident."],["Who intervenes in case of an accident?","Teacher","First aider / Life Guard Rescuer","Driver","Cook",1,"The first aider / Life Guard Rescuer intervenes: PROTECT — ALERT — RESCUE."],["Which can be caused by stress at work?","Good sleep","More energy","Depression","Better health",2,"Stress at work can cause headache, hypertension and depression."],["Unwanted fires are often caused by","Rain","Short circuit / flammable materials","Cold","Water",1,"Short circuits and flammable materials cause unwanted fires."],["Prolonged muscular activity causes","Rest","Fatigue / cramp","Sleep","Relaxation",1,"Prolonged muscular activity causes fatigue and cramp."],["Thermal discomfort is caused by","Only light","Heat, cold, humidity, radiant temperature","Only noise","Only colour",1,"Thermal discomfort comes from heat, cold, humidity and radiant temperature."],["Poor lighting causes","Good vision","Visual fatigue / tearing","Better hearing","Strong muscles",1,"Poor lighting causes visual fatigue and tearing."],["The HSCCW Committee (Health Safety Conditions of Work Committee)","Promotes safety","Sells products","Collects taxes","Builds roads",0,"The HSCCW Committee promotes safety and good working conditions."],["Noise risks include","Better hearing","Deafness, fatigue, stress","Good sleep","Clear vision",1,"Noise can cause deafness, fatigue and stress."],["A prevention policy acts on","Operator, environment, work post","Customers only","Ignoring risks","Punishing workers",0,"Prevention acts on the operator, the environment and the work post."],["An employee taking up office","Must be informed / trained on risks","Must work alone","Must ignore PPE","Must skip training",0,"A new employee must be informed and trained on risks."],["Which statement about PPE is correct?","Gloves, goggles, helmet, boots, mask — choose according to risk","Only a helmet, always","No PPE is needed","Only gloves, always",0,"PPE (gloves, goggles, helmet, boots, mask) is chosen according to the risk."],["Risk prevention first means","Eliminate risk at source","Wait for an accident","Hide the risk","Blame the worker",0,"Prevention = eliminate the risk at source when possible."],["Risks for a carpenter include","Cuts, dust, noise, falls","Only reading","Only sitting","Only singing",0,"A carpenter faces cuts, dust, noise and falls."],["Noise can be reduced by","Ear protectors, isolate machines","Shouting louder","Removing protectors","Working longer",0,"Ear protectors and isolating machines reduce noise."],["Lighting of a workshop should be","Sufficient, natural + artificial, no glare","Dark","Only glare","No lights",0,"Workshop lighting must be sufficient, natural + artificial, without glare."],["The roles of a Life Guard Rescuer are","PROTECT-ALERT-RESCUE","RUN-HIDE-IGNORE","ALERT only","RESCUE only",0,"Life Guard Rescuer: PROTECT → ALERT → RESCUE."],["The colour for danger is","Green","Blue","Yellow","Red",3,"Red = danger / prohibition."],["Characteristics of light are","Intensity, colour, direction","Only weight","Only sound","Only smell",0,"Light is described by intensity, colour and direction."],["Signs of stress include","Headache, irritability, fatigue","Strong muscles","Good sleep","Clear mind",0,"Stress signs: headache, irritability, fatigue."],["Greenhouse gases include","Oxygen and nitrogen","CO2, methane, nitrous oxide","Rain and snow","Sand and stones",1,"Greenhouse gases: CO2, methane, nitrous oxide."],["Organic waste is treated by","Burning plastic","Composting","Dumping in a river","Burying glass",1,"Organic waste treatment = composting."],["The Kyoto reduction target in this paper is","1%","2%","5.2%","20%",2,"Kyoto reduction = 5.2% in this paper."],["Which activity does NOT promote global warming?","Burning forests","Planting trees, using renewable energy","Burning coal","Dumping oil",1,"Planting trees and using renewable energy do not promote warming."],["Waste recovery means","Recycling, reuse","Dumping","Burning openly","Burying",0,"Waste recovery = recycling and reuse."],["Environmental management in Cameroon is under the","Ministry of Environment, Nature Protection and Sustainable Development","Ministry of Sports","Ministry of Transport","Ministry of Finance",0,"In Cameroon it is the Ministry of Environment, Nature Protection and Sustainable Development."],["An ecosystem is","A single animal","Living organisms + surroundings","A single plant","A single rock",1,"An ecosystem = living organisms and all that surrounds them."],["Greenhouse consequences include","More snow only","Global warming, floods, drought","More fish only","More flowers only",1,"Greenhouse effect consequences: global warming, floods, drought."],["Human activity most affecting the environment is","Deforestation, pollution, industry","Reading","Singing","Sleeping",0,"Deforestation, pollution and industry most affect the environment."],["Noise pollution is","Pleasant music","Unwanted sound harming health","Silence","Bird song",1,"Noise pollution = unwanted sound harming health."]],K0=[["Section A • Q1 — Diana: Quality, Quality Services & Non-Quality",`PROFESSIONAL SITUATION: Diana is a cleaning agent for 15 years at a hospital. She works 6am–1.30pm, alone, and suffers low back pain / lumbago. Tasks: empty bin, pick up waste, wet sweep, wash floor, prepare material for next room.

QUALITY: Quality is fitness for use — a service that meets the customer's need and the required standard.

QUALITY SERVICES OF THE HOSPITAL: clean rooms and toilets, safe and welcoming care, hygiene rules respected, work done on time, waste well removed.

CAUSES OF NON-QUALITY: unqualified / untrained staff, poor organisation, unsuitable material, no respect for procedures, lack of control, working alone with too much workload.`],["Section A • Q2 — ISO, Audit, TPM / TQM & Five Zeros",`ISO = International Standardisation Organization. It publishes standards that help an enterprise work with quality.

CERTIFICATION: Recognition by an independent (third) body that the quality system is implemented and respected.

QUALITY AUDIT — 3 STAGES: (1) Preparation — plan, documents, checklist. (2) Carrying out the audit — observe, ask, check conformity. (3) Report / follow-up — write findings, non-conformities, corrections.

TPM = Total Productive Maintenance: maintain machines / material to avoid breakdowns and defects. TQM = Total Quality Management: whole company mobilised for client satisfaction.

FIVE ZEROS: zero defect, zero delay, zero breakdown, zero stock, zero paper.`],["Section B • Q1 — Chronogram: Cumulative Duration + Longest Task",`A CHRONOGRAM shows Diana's tasks against time. Each shaded square = a unit of time.

HOW TO READ IT: Read left to right. For each task, count the shaded squares / length of the bar = its duration. Then go to the next task.

CUMULATIVE DURATION: Add the durations one after another — empty bins (16 min given) + maintain toilets + wet sweep + wash floor + prepare material for next room = total time of the work cycle.

LONGEST TASK: The task with the most shaded squares / longest bar. In this chronogram it is wash floor / wet sweep — it takes more time than emptying bins (16 min) and the other tasks.`],["Section B • Q2 — Vertebral Column + Intervertebral Disc + Lumbago",`VERTEBRAL COLUMN: 33 vertebrae — 7 cervical (neck), 12 dorsal / thoracic (back), 5 lumbar (lower back), 5 sacral (sacrum), 4 coccyx. It supports head and trunk and protects the spinal cord.

INTERVERTEBRAL DISC: Cartilage between two vertebrae. It cushions shocks and allows movement.

LUMBAGO: Pain in the lower back / lumbar region. Mechanism: repeated bending, lifting and twisting strain muscles, ligaments and discs. Diana's posture: lean forward with a straight back, squat / bend knees to pick up, stand steadily, avoid twisting while carrying.`],["Section C • Q1 — Biological Risk",`BIOLOGICAL RISK: Risk of infection / disease from living agents — bacteria, viruses, fungi, parasites — present in hospital waste, blood, body fluids and dirty surfaces.

DIANA'S EXPOSURE: She empties bins, picks up waste, wet sweeps and washes floors — she can touch contaminated waste, breathe dust / aerosols, and hurt herself with sharps.

HYPOTHESES FOR PHYSICAL + BIOLOGICAL RISKS: Physical — bending, lifting, twisting, standing long, working alone. Biological — contact with waste, germs, blood, dirty water.`],["Section C • Q2 — Human / Company Determinants + Prescribed vs Actual Work",`HUMAN DETERMINANTS: Diana's age, health, strength, fatigue, training, 15 years of experience, low back pain.

COMPANY DETERMINANTS: Organisation, timetable 6am–1.30pm, material provided, workload, working alone, hospital rules.

PRESCRIBED WORK: What is ordered / written — empty bin, pick up waste, wet sweep, wash floor, prepare material for next room.

ACTUAL WORK: What Diana really does — with real difficulties: heavy bins, wet floors, no help, pain, adjustments to finish on time.

EFFECTS ON OPERATOR: Fatigue, lumbago, illness, accidents. EFFECTS ON COMPANY: Absenteeism, lower quality, delays, costs.`],["Section C • Q3 — Solutions: Physical (3) + Biological (2) With Justifications",`PHYSICAL SOLUTIONS (3):
(1) Use long-handled tools — justification: no need to bend the back, less lumbar strain.
(2) Bend the knees, not the back — justification: legs carry the load, back stays straight.
(3) Avoid twisting / take breaks / work in pairs — justification: twisting strains the lumbar spine; breaks let muscles recover; a partner shares heavy loads.

BIOLOGICAL SOLUTIONS (2):
(1) Wear PPE — gloves, mask, goggles, adapted blouse — justification: barrier against germs, blood and chemicals.
(2) Wash hands, disinfect material, sort waste safely — justification: removes germs and breaks the chain of infection.`],["Section C • Q4 — Biological Agents Groups",`GROUP 1: No disease in humans.
GROUP 2: Can cause disease, spread unlikely, prophylaxis (prevention / treatment) exists.
GROUP 3: Serious disease, spread possible, prophylaxis exists.
GROUP 4: Serious disease, spread high, no prophylaxis.

DIANA'S AGENTS — GROUP 2: Legionella, Leptospira, Staphylococcus aureus, Hepatitis A.
DIANA'S AGENTS — GROUP 3: Tuberculosis bacilli, Brucellosis, HIV.

So Diana is exposed to Group 2 and Group 3 agents: disease possible, spread possible for Group 3, but prophylaxis exists.`],["Section C • Q5 — Epidemiological Chain — Table 05",`EPIDEMIOLOGICAL CHAIN: Reservoir → Transmission → Route of entry → Host. Break one link to prevent infection.

CASE 01 — Bacillus tuberculosis (Tuberculosis bacilli): Reservoir = Patient. Transmission = Dialogue with patient (talking / close contact). Route of entry = Respiratory (breathing in germs).

CASE 02 — Staphylococcus aureus: Reservoir = Patient / skin. Transmission = Contact (touching patient, waste, surfaces). Route of entry = Dermal (through the skin, especially cuts / wounds).`],["Section C • Q6 — Professional Disease + Who Qualifies + Individual vs Collective Measures",`PROFESSIONAL DISEASE: A disease caused by work / exposure at work, recognised in a list of occupational diseases.

WHO QUALIFIES IT: The occupational doctor / competent authority — not the worker alone.

INDIVIDUAL vs COLLECTIVE MEASURES (as in the paper): Hearing protector = Individual. Adapted white cotton blouse = Collective. Gloves = Individual. Dilute contaminants / ventilation = Collective. Respiratory protector = Individual. Isolate workstations = Collective. Safety shoes = Individual. Protective glasses = Individual. Hood = Collective.

Individual = protects one worker (PPE). Collective = protects all workers (ventilation, isolation, organisation).`],["Section D • Q1 — Medical Waste: Effects + Destruction",`MEDICAL WASTE: Waste from care — sharps, infected dressings, blood, medicines, contaminated material.

3 DIRECT ENVIRONMENTAL EFFECTS: (1) Pollution of water — germs / chemicals in streams and wells. (2) Pollution of soil — waste dumped on ground harms soil and plants. (3) Pollution of air — burning / rotting waste harms air and living beings.

2 ENVIRONMENTALLY FRIENDLY DESTRUCTION METHODS: (1) Incineration in a controlled / adapted incinerator. (2) Safe treatment / sterilisation before disposal, then disposal in an adapted centre. Never dump medical waste in nature or in ordinary bins.`],["Section D • Q2 — Global Warming: Definition, Causes, Actions",`DEFINITION: Global warming = rise in the Earth's average temperature caused by greenhouse gases that trap heat.

2 CAUSES: (1) Burning fossil fuels (fuel, coal, gas) for energy, transport and industry. (2) Deforestation / polluting human activities — fewer trees to absorb CO2, more gases released.

2 ACTIONS TO LIMIT IT: (1) Plant trees. (2) Use renewable energy / save energy — switch off unused lights, use efficient lamps, reduce waste.`],["Section D • Q3 — Recyclable Waste + Treatment Matching",`TREATMENT CODES: 1 = Recycling, 2 = Incineration, 3 = Composting, 4 = Storage Center.

MATCHING: Brochures = 1 Recycling. Plastic bottles = 1 Recycling. Wax strip = 2 Incineration. Polish / solvent bottles = 4 Storage Center. Food waste = 3 Composting.

So: paper / plastic that can be re-used → Recycling. Organic food waste → Composting. Wax / waste that must be burnt safely → Incineration. Dangerous polish / solvent bottles → Storage Center, never dumped in nature.`]],Y0=[["1. Quality — Policy, Planning, System & Quantities","Quality policy, quality planning and quality system are all related to quality — they organise how an enterprise works to meet the standard. Quality quantities is NOT a quality term. Quality = fitness for use / superiority of something relative to others."],["2. ISO 9001-4, Standardisation & Certification","The principal standards related to quality in this paper are ISO 9001-4. Standardisation = examination of product quality, process and organisation by a standard organisation. Certification = the document issued by a standard organisation to an enterprise which observes the quality policy."],["3. Pareto, Brainstorming, Five Zeroes & Quality Circles","Pareto diagram analyses numerical data — a few causes make most defects. Brainstorming analyses non-numerical data / ideas. The Five zeroes method aims for zero defect, zero delay, zero breakdown, zero paper and more — zero stock does NOT belong to it in this paper. Quality circles are groups that choose maintenance policies leading to quality objectives."],["4. Muscle Properties, Accidents & Deformities","Muscle properties: contractility, elasticity, excitability. Conductibility is NOT a muscle property — it belongs to nerves. Muscle accidents include dislocation, fracture and elongation. Scoliosis is NOT a muscle accident — it is a deformity of the vertebral column. Kyphosis is also a deformity / abnormal curvature of the vertebral column."],["5. Diabetes, Blood Diseases & Blood Vessels","A high blood sugar level causes the nutritional disease diabetes. Leukaemia, sickle cell disease and anaemia ARE blood diseases. Blood vessels are arteries if they carry blood to the organs — arteries carry blood away from the heart, towards the organs."],["6. Inflammation, Incubation & the Meninges","An inflammatory reaction is characterised by swelling, redness, heat and pain. The period between contamination and the appearance of disease is incubation. The meninges are Dura mater, Arachnoid and Pia mater — meningitis is NOT a layer, it is inflammation of the meninges."],["7. Digestive Tract, Larynx & the Circulatory System","Oesophagus, stomach and mouth belong to the digestive tract. The larynx does NOT belong to the digestive tract — it belongs to the respiratory tract. The circulatory system does NOT open to the outside environment, unlike the digestive, respiratory and urinary systems."],["8. Work Accident — Employer & Lifeguard Rescuer","In the event of a work-related accident, the professional responsible is the employer — the employer declares the accident and organises help. The first person authorized to intervene in a work-related accident is the lifeguard rescuer: PROTECT → ALERT → RESCUE."],["9. Stress, Fire, Muscle Fatigue, Thermal & Visual Fatigue","To prevent stress in the worksite: organise your work and rest well. To prevent fire outbreaks, a company must permanently have fire extinguishers of different kinds. Prolonged efforts can lead to muscle fatigue. Thermal discomfort in a hot environment is manifested by a lot of perspiration. Visual fatigue due to poor lighting is manifested by tearing."],["10. Preventive Measures, Screen Work & Protecting the Hands","Preventive measures for physical activity risks act on the operator, the environment and the work post / task — action on the employer is NOT part of them in this paper. For prolonged work in front of a screen: take breaks, rest your eyes, relax. Hands exposed to chemical burns: protect hands and use an automatic system."],["11. Fatal Accidents, Explosions, Ladder, Scaffold & Auto-Immune","Fatal accidents are due more often to poisoning and asphyxia. Explosions due to overpressures are manifested by flames and projections of all kinds. On a ladder: keep one hand free / use only one hand that can be held — do not lean over. On scaffolding: you can move the scaffolding if it is a rolling scaffolding. Auto-immune diseases are due to an excessive immune response."],["12. Greenhouse, Kyoto 5.2%, Biodegradable, Used Oils, Malaria–Cholera, Landslides & Sahel Vert","Carbon dioxide is the greenhouse gas that destroys the environment in this paper. The Kyoto Protocol (2005) aimed at a 5.2% reduction for 2008–2012 compared to 1990. Biodegradable materials are organic materials. Used oils that protect the environment are treated by regeneration. A dirty environment brings malaria and cholera. Intensive agriculture is NOT related to landslides. The Sahel Vert / Green Sahel operation in Cameroon in the 1980s aimed at planting trees in the Sahelian zone."]],X0=[["Terms not related to quality","Quality policy","Quality planning","Quality system","Quality quantities",3,"Quality policy, planning, system are related to quality. Quality quantities is not."],["Principal standards related to quality","ISO 14000","ISO 9001-4","ISO 45001","ISO 31000",1,"The principal quality standards in this paper are ISO 9001-4."],["A skill to analyse numerical data","Pareto diagram","Brainstorming","Fishbone diagram","Control sheet",0,"Pareto diagram analyses numerical data — few causes, many defects."],["A skill to analyse non-numerical data","Histogram","Brainstorming","Pareto diagram","Control chart",1,"Brainstorming is the key for non-numerical ideas / data in this paper."],["A quality component in an enterprise","Noise","Delay","Waste","Reliability",3,"Reliability is a quality component — the product/service does what is expected, every time."],["Examination of product quality, process and organisation by a standard organisation","A standardisation","Marketing","Advertising","Transport",0,"Examination of product quality, process and organisation by a standard organisation is standardisation."],["Document issued by a standard organisatio ted by the thyroid help in","Digestion","Blood pumping","Skeletal Growth","Vision",2,"Hormones secreted by the thyroid help in skeletal growth."],["Which is not a blood disease?","Leukaemia","Tuberculosis","Sickle cell disease","Anaemia",1,"Leukaemia, sickle cell disease and anaemia are blood diseases; tuberculosis is not."],["Blood vessels","Are arteries if they carry blood to the organs","Are veins if they carry blood to the organs","Are capillaries only","Do not carry blood",0,"Blood vessels are arteries if they carry blood to the organs."],["Inflammatory reaction is characterised by","Pain only","Redness only","Swelling only","Swelling, redness, heat and pain",3,"Inflammation = swelling, redness, heat and pain."],["Types of food used as a source of energy in prolonged exercise","Proteins","Vitamins","Carbohydrates","Minerals",2,"Carbohydrates are the main source of energy in prolonged exercise."],["The period between contamination and appearance of disease","Infection","Incubation","Inflammation","Recovery",1,"The period between contamination and appearance of disease is incubation."],["Which layer is closest to nervous tissues / is NOT a layer?","Arachnoid","Pia mater","Dura mater","Meningitis is NOT a layer",3,"Arachnoid, Pia mater and Dura mater are meninges; meningitis is inflammation, not a layer."],["An organ that does not belong to the digestive tract","Oesophagus","Stomach","Larynx","Mouth",2,"Oesophagus, stomach and mouth are digestive; larynx is respiratory."],["A system that does not open to the outside environment","Digestive system","Circulatory system","Respiratory system","Urinary system",1,"Digestive, respiratory and urinary systems open to the outside; circulatory does not."],["In the event of a work-related accident, the professional responsible is","The visitor","The customer","The worker alone","The employer",3,"In the event of a work-related accident, the professional responsible is the employer."],["The first person authorized to intervene
